<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NocStudio</title>
<script>try { if (localStorage.getItem('studio.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="icon" href="web/studio.ico?v=2"><!-- raise v when the icon changes: a browser keeps the one it saw first for an address -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- on a phone the page runs up behind the clock -->
<link rel="apple-touch-icon" href="web/icon-256.png">
<link rel="manifest" href="web/manifest.json">
<link rel="stylesheet" href="web/style.css">
<style>
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; }
  .proj { display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-height: 132px; }
  .proj:hover, .proj:focus-visible { border-color: var(--accent); outline: none; }
  .proj[disabled] { cursor: default; opacity: 0.55; border-color: var(--line); }
  .proj .name { font: 700 22px/1.15 var(--font-display); font-stretch: 87%; color: var(--fg); }
  .proj .where { font: 12px/1.4 var(--font-mono); color: var(--faint); overflow-wrap: anywhere; }
  .proj .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .proj .when { font-size: 12px; color: var(--muted); }
  .proj.waits { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface);
    box-shadow: 0 0 0 1px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent); }
  .proj.waits .name::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 10px 2px 0;
    background: var(--accent); vertical-align: middle; animation: beat 1.6s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .proj.waits .name::before { animation: none; } }
  #vault { margin-top: 28px; }
  .ideabox { margin-top: 14px; max-width: 980px; }
  .ideabox form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .ideabox .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .ideabox .said { flex: 1 1 auto; font-size: 13px; }
  .dump { display: flex; flex-direction: column; gap: 8px; max-width: 980px; margin-bottom: 14px; }
  .dump .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dump .row .muted { flex: 1 1 auto; font-size: 13px; }
  .dump .said { font-size: 13px; color: var(--fg); }
  .vpages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; align-items: start; }
  .vpage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; max-height: 70vh; overflow: auto; min-width: 0; }
  .vpage .vh { display: flex; gap: 10px; align-items: baseline; }
  .vpage .vh h2 { margin: 0; }
  .vpage .md { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .vpage .md h3, .vpage .md h4 { margin: 14px 0 4px; font-size: 15px; }
  .vpage .md p { margin: 4px 0; }
  .vpage .md ul, .vpage .md ol { margin: 4px 0; padding-left: 22px; }
  .vpage .md li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; }
  .vpage .md li.task .tick { flex: 0 0 16px; height: 16px; margin-top: 3px; border: 1px solid var(--line); border-radius: 3px; font-size: 12px; line-height: 14px; text-align: center; color: var(--accent-fg); }
  .vpage .md li.task.done { color: var(--muted); }
  .vpage .md .wl { color: var(--accent-fg); }
  .vpage .md .tw { overflow-x: auto; }
  .vpage .md table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  .vpage .md th, .vpage .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
  .vpage .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
</style>
</head>
<body>
<header class="top"><span class="brand"><b>Noc</b>Studio<small>Your projects</small></span></header>
<main>
  <section>
    <h1 id="head">Your projects</h1>
    <p class="lede" id="lede">Pick one to open its Studio. It runs while this window is open and stops when you close it.</p>
    <div class="projects" id="list"></div>
    <div class="ideabox" id="idea" hidden>
      <button class="btn small" type="button" id="idea-open">Start from an idea</button>
      <form id="idea-form" hidden>
        <input class="field" id="idea-name" type="text" maxlength="60" placeholder="A name for it (the project folder gets this name)" aria-label="The idea's name">
        <textarea class="field" id="idea-text" rows="4" placeholder="The idea, however loose. Claude asks you 3 to 5 questions at a time until it is clear, then writes the spec." aria-label="The idea"></textarea>
        <div class="row"><span class="said" id="idea-said" role="status"></span><button class="btn small" type="button" id="idea-cancel">Not now</button><button class="btn small primary" type="submit">Start</button></div>
      </form>
    </div>
    <div class="empty" id="none" hidden>No project has a Studio yet. In a project, say to Claude Code: <code class="i">create a studio page for this</code></div>
  </section>
  <section id="vault" hidden>
    <h1>Your notes</h1>
    <div class="dump" id="vault-dump" hidden>
      <textarea class="field" id="vault-text" rows="2" aria-label="A thought for later" placeholder="A thought for later. Enter adds it; Shift+Enter starts a new line."></textarea>
      <div class="row"><span class="muted" id="vault-dump-to"></span><span class="said" id="vault-said" role="status"></span><button class="btn small primary" type="button" id="vault-add">Add</button></div>
    </div>
    <div class="vpages" id="vault-pages"></div>
  </section>
</main>
<script>
(() => {
  'use strict';
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  const list = document.getElementById('list'), none = document.getElementById('none');
  let busy = false;
  // framed by a launcher on the same site (an app library): it keeps the notch clear and owns light and dark
  const shell = (() => { try { return window.self !== window.top ? window.parent.document.documentElement : null; } catch (e) { return null; } })();
  const theme = (t) => { if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; };
  if (shell) {
    document.documentElement.classList.add('framed');
    const follow = () => { if (shell.dataset.theme) theme(shell.dataset.theme); };
    follow();
    try { new window.parent.MutationObserver(follow).observe(shell, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { /* a launcher that changes nothing */ }
  }
  async function open(row, card) {
    const to = row.waitsTalk ? '#talk' : '';  // a session waits on you: straight to its Talk page
    if (row.url) { location.href = row.url + to; return; }  // a server's menu: every Studio is already up
    if (busy) return; busy = true;
    card.querySelector('.chips').replaceChildren(el('span', 'chip accent', 'Starting'));
    try {
      const res = await fetch('api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ home: row.home }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'It did not start');
      location.href = data.url + to;
    } catch (e) { busy = false; card.querySelector('.chips').replaceChildren(el('span', 'chip bad', String(e.message || e))); }
  }
  function look(ui) {
    if (ui.scale) document.documentElement.style.zoom = String(ui.scale);
    if (!shell) theme(ui.theme);
    try { localStorage.setItem('studio.theme', ui.theme === 'light' ? 'light' : 'dark'); } catch (e) { /* private window */ }
  }
  function ago(t) {
    if (!t) return '';
    const s = Date.now() / 1000 - t;
    if (s < 90) return 'Worked on just now';
    if (s < 5400) return 'Worked on ' + Math.round(s / 60) + ' min ago';
    if (s < 129600) return 'Worked on ' + Math.round(s / 3600) + ' h ago';
    if (s < 86400 * 45) return 'Worked on ' + Math.round(s / 86400) + ' days ago';
    return 'Worked on ' + new Date(t * 1000).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
  }
  function draw(rows) {
    none.hidden = rows.length > 0;
    list.replaceChildren(...rows.map((row) => {
      const card = el('button', 'proj'); card.type = 'button';
      const chips = el('div', 'chips');
      if (row.missing) { card.disabled = true; chips.append(el('span', 'chip bad', 'Its folder is gone')); }
      else {
        const talk = row.talk || {};
        row.waitsTalk = !!(talk.asks || talk.replies);
        if (row.waitsTalk) {
          card.classList.add('waits');
          card.title = 'A Talk session waits on you; this opens its Talk page';
          if (talk.asks) chips.append(el('span', 'chip accent', talk.asks === 1 ? 'Talk asks you' : talk.asks + ' talks ask you'));
          if (talk.replies) chips.append(el('span', 'chip accent', talk.replies === 1 ? 'Claude replied' : talk.replies + ' replies to read'));
        }
        chips.append(el('span', 'chip' + (row.judge ? ' accent' : ''), row.judge ? row.judge + ' to judge' : 'Nothing to judge'));
        if (row.notes) chips.append(el('span', 'chip accent', row.notes + (row.notes === 1 ? ' note waits' : ' notes wait') + ' on you'));
        if (row.hands) chips.append(el('span', 'chip', row.hands + ' only you can do'));
        if (row.sent) chips.append(el('span', 'chip', row.sent + ' waiting on Claude'));
        if (row.running) chips.append(el('span', 'chip keep', 'Open'));
        card.addEventListener('click', () => open(row, card));
      }
      card.append(...[el('div', 'name', row.name), row.url ? null : el('div', 'where', row.repo || row.home),
        row.touched ? el('div', 'when', ago(row.touched)) : null, chips].filter(Boolean));
      return card;
    }));
  }
  async function load() {
    if (busy) return;
    try {
      const data = await (await fetch('api/hub')).json(); look(data.ui || {}); draw(data.studios || []);
      if (data.served) document.getElementById('lede').textContent = 'Pick one to open its Studio.';
    } catch (e) { /* the app is closing */ }
  }
  load(); setInterval(load, 5000);
  window.addEventListener('pageshow', () => { busy = false; load(); });
})();
</script>
<script src="web/vault.js"></script>
<script>
(() => { // start from an idea: only where the app's hub.toml says where new projects go
  const box = document.getElementById('idea'), form = document.getElementById('idea-form'), said = document.getElementById('idea-said');
  fetch('api/ideas').then((r) => r.json()).then((d) => { box.hidden = !d.ideas; }).catch(() => {});
  document.getElementById('idea-open').addEventListener('click', () => { form.hidden = false; document.getElementById('idea-name').focus(); });
  document.getElementById('idea-cancel').addEventListener('click', () => { form.hidden = true; said.textContent = ''; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); said.textContent = 'Making its folder and Studio…';
    try {
      const res = await fetch('api/idea', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: document.getElementById('idea-name').value, text: document.getElementById('idea-text').value }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'It was not made');
      location.href = d.url;
    } catch (err) { said.textContent = String(err.message || err); }
  });
})();
</script>
</body>
</html>
