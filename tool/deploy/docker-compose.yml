# Copies of your Studios on a server, so a phone can reach them: one page in a container, behind your own login
# (a reverse proxy with sign-in, such as Authelia; the Studio has none of its own). It shows a menu of the
# projects at / and each Studio at /<its name>/. Each Studio home is a git clone of the PC's, and
# tool/deploy/sync.sh keeps them in step. From the home that holds the tool:
#
#   STUDIO_CONTAINER=studio-app STUDIO_NETWORK=web \
#   STUDIO_HOMES_DIR=/srv/studios STUDIO_MORE="/homes/game-two-studio" \
#   docker compose -p studio -f tool/deploy/docker-compose.yml up -d
#
# STUDIO_HOMES_DIR is a folder of the other Studio homes, seen in the container as /homes, and STUDIO_MORE
# names the ones to serve (leave both out for this home alone). The proxy reaches the container by name on that
# network, at port 8771, with its own path taken off (apps.example.com/studio/... arrives as /...). Name the
# proxy in this home's studio.local.toml, and give every copy on the server a site letter there:
#
#   site = "p"
#   [serve]
#   hosts = ["studio-app:8771", "apps.example.com"]

services:
  studio:
    image: python:3.11-slim
    container_name: ${STUDIO_CONTAINER:-studio-app}
    restart: unless-stopped
    user: "1000:1000"            # the owner of the clones, so what the page writes the sync can commit
    working_dir: /studio
    command: ["sh", "-c", "exec python tool/studio.py serve-all /studio $$STUDIO_MORE --host 0.0.0.0 --port 8771"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      STUDIO_MORE: ${STUDIO_MORE:-}
    volumes:
      - ../..:/studio
      - ${STUDIO_HOMES_DIR:-../..}:/homes
    networks:
      - web

networks:
  web:
    name: ${STUDIO_NETWORK:-web}
    external: true
